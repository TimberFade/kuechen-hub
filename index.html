<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Küchen-Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Küchen-Hub">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg1:#0b1026;--bg2:#1b1f4b;--bg3:#3a1c5c;
  --fill-a:rgba(255,255,255,.15);--fill-b:rgba(255,255,255,.055);
  --strong-a:rgba(255,255,255,.33);--strong-b:rgba(255,255,255,.12);
  --stroke:rgba(255,255,255,.34);--text:#fff;--sub:rgba(255,255,255,.65);
  --accent:#8fd8ff;--accent2:#c79bff;--card:rgba(27,31,63,.94);--b:110px;
}
html.light{
  --bg1:#d6e6ff;--bg2:#efe2ff;--bg3:#ffead8;
  --fill-a:rgba(255,255,255,.72);--fill-b:rgba(255,255,255,.3);
  --strong-a:rgba(255,255,255,1);--strong-b:rgba(255,255,255,.5);
  --stroke:rgba(255,255,255,.95);--text:#1a1c2e;--sub:rgba(26,28,46,.6);
  --accent:#2f6bff;--accent2:#9b5cff;--card:rgba(244,246,255,.96);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;overflow:hidden;overscroll-behavior:none}
/* The gradient sits on the page itself and the content is pinned to all four edges, so no strip of the default white page can show. */
/* iPad home-screen apps with a see-through status bar lay the page out one status-bar height too short, which leaves
   a strip at the bottom. Making the page that much taller and sizing the content by the real screen height closes it. */
html{height:100%;min-height:calc(100% + env(safe-area-inset-top));background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed var(--bg2)}
body{
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Roboto,sans-serif;color:var(--text);
  position:fixed;top:0;left:0;width:100%;height:100vh;background:transparent;
  -webkit-user-select:none;user-select:none;
  padding:calc(env(safe-area-inset-top) + 26px) 28px calc(env(safe-area-inset-bottom) + 26px);
}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:var(--text);background:transparent;
  border:1px solid var(--stroke);border-radius:14px;padding:12px 14px;font-size:21px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--accent)}
.screen{height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}
.glass{
  background:linear-gradient(180deg,var(--fill-a),var(--fill-b));
  border:1px solid var(--stroke);border-bottom-color:transparent;border-radius:26px;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
}
.glass.strong{background:linear-gradient(180deg,var(--strong-a),var(--strong-b))}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:18px;font-size:19px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.strong{font-weight:700}
.btn:active,.tile:active{transform:scale(.97)}
header{display:flex;align-items:center}
#clock{font-size:78px;font-weight:200;line-height:1;letter-spacing:-1px}
#date{font-size:21px;color:var(--sub);margin-top:6px}
#chips{margin-left:auto;display:flex;gap:10px;align-items:center}
.chip{padding:11px 17px;border-radius:18px;font-size:21px;font-weight:600}
#gear{width:58px;height:58px;border-radius:29px;display:flex;align-items:center;justify-content:center}
#gear svg{width:26px;height:26px}
#grid{flex:1;min-height:0;margin-top:24px;display:grid;gap:18px;align-content:start;grid-auto-flow:dense}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;cursor:pointer;text-align:center;min-width:0}
.badge{width:var(--b);height:var(--b);border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 38%,transparent),color-mix(in srgb,var(--accent2) 22%,transparent));
  border:1px solid rgba(255,255,255,.4);border-bottom-color:rgba(255,255,255,.06)}
.badge svg{width:50%;height:50%}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.label{margin-top:14px;font-size:20px;font-weight:500;letter-spacing:.3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.wx .badge{width:calc(var(--b)*.7);height:calc(var(--b)*.7)}
.temp{font-size:42px;font-weight:300;line-height:1.1;margin-top:6px}
.small{font-size:15px;color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid{font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile[data-span="2"]{grid-column:span 2}
.tile.ag{align-items:stretch;justify-content:flex-start;text-align:left;padding:16px 20px}
.aghead{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:500;letter-spacing:.3px;margin-bottom:10px}
.aghead .badge{width:40px;height:40px}
.ev{display:flex;gap:10px;font-size:18px;padding:4px 0;min-width:0}
.ev b{color:var(--accent);font-weight:600;flex:none;width:158px;white-space:nowrap}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editbar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px}
.round{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;
  background:var(--strong-a);border:1px solid var(--stroke);cursor:pointer}
.round.right{margin-left:auto}
.plus{font-size:64px;font-weight:200;color:var(--sub)}
/* kitchen */
.khead{display:flex;align-items:center;gap:10px}
.khead h1{font-size:30px;font-weight:600;margin:0 8px}
.khead .tabs{margin-left:auto;display:flex;gap:10px}
#kbody{flex:1;min-height:0;margin-top:20px;padding:24px;overflow:auto;-webkit-overflow-scrolling:touch}
.cols{display:flex;gap:26px;height:100%}
.cols>div{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden}
.wrap{display:flex;flex-wrap:wrap;gap:10px}
.sub{color:var(--sub);font-size:20px;margin:0 0 12px}
.tcard{padding:16px 18px;margin-bottom:12px;border-radius:20px}
.tcard .big{font-size:46px;font-weight:600;line-height:1.1}
.bar{height:7px;border-radius:4px;background:var(--strong-b);margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.row{display:flex;align-items:center;gap:12px}
.res{font-size:30px;margin:8px 0}
.item{display:flex;align-items:center;gap:14px;padding:15px 18px;margin-bottom:9px;border-radius:16px;font-size:23px;cursor:pointer}
.item.done span{color:var(--sub);text-decoration:line-through}
/* dialogs */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:30px;padding:28px;min-width:380px;max-width:92vw;max-height:92vh;overflow:auto}
.card h2{margin:0 0 16px;font-size:25px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.dots{display:flex;gap:13px;justify-content:center;margin:6px 0 18px}
.dots i{width:17px;height:17px;border-radius:50%;background:var(--strong-b);border:1px solid var(--stroke)}
.dots i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:13px;justify-content:center}
.pad div{height:78px;border-radius:39px;display:flex;align-items:center;justify-content:center;font-size:29px;cursor:pointer}
.icons{display:flex;flex-wrap:wrap;gap:8px}
.icons div{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icons svg{width:26px;height:26px}
</style>
</head>
<body>
<div id="home" class="screen">
  <header>
    <div><div id="clock"></div><div id="date"></div></div>
    <div id="chips"></div>
  </header>
  <div id="grid"></div>
</div>
<div id="kitchen" class="screen hidden">
  <div class="khead">
    <div class="btn glass" data-act="home">‹ Zurück</div><h1>Küchen-Helfer</h1>
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="kbody" class="glass"></div>
</div>
<div id="dlg" class="hidden"></div>

<script>
"use strict";
/* Shown in the admin menu. Raise it with every upload so it is clear which version the iPad is running. */
const VERSION = "7 · 14.11.2026";

/* ---------- storage ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem("hub." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("hub." + k, JSON.stringify(v)); } catch (e) {} },
};
const DEFAULT_TILES = [
  { id: "kitchen", type: "kitchen", label: "Küchen-Helfer", icon: "pot" },
  { id: "chefkoch", type: "link", label: "Chefkoch", icon: "chef", url: "https://www.chefkoch.de" },
  { id: "youtube", type: "link", label: "YouTube", icon: "play", url: "https://www.youtube.com" },
  { id: "chatgpt", type: "link", label: "ChatGPT", icon: "chat", url: "https://chatgpt.com" },
  { id: "agenda", type: "agenda", label: "Termine", icon: "calendar", url: "https://calendar.google.com/calendar/r?hl=de" },
  { id: "weather", type: "weather", label: "Wetter", icon: "partly" },
];
// Layout version 2 dropped Smart Home, Spotify, Drive and Gemini: start again from the new defaults.
if (LS.get("v", 1) < 2) { LS.set("tiles", DEFAULT_TILES); LS.set("v", 2); }
// Version 3 dropped Chrome: take it out of layouts that were already saved, and leave the rest as arranged.
if (LS.get("v", 1) < 3) { LS.set("tiles", LS.get("tiles", DEFAULT_TILES).filter(t => t.id !== "chrome")); LS.set("v", 3); }
// Version 4: YouTube opens as a web page inside this app, so it still works while Guided Access locks the iPad to it.
if (LS.get("v", 1) < 4) { LS.set("tiles", LS.get("tiles", DEFAULT_TILES).map(t => t.url === "youtube://" ? Object.assign({}, t, { url: "https://www.youtube.com" }) : t)); LS.set("v", 4); }
// Version 5: ask Google Calendar for its German interface.
if (LS.get("v", 1) < 5) { LS.set("tiles", LS.get("tiles", DEFAULT_TILES).map(t => t.url === "https://calendar.google.com" ? Object.assign({}, t, { url: "https://calendar.google.com/calendar/r?hl=de" }) : t)); LS.set("v", 5); }
let tiles = LS.get("tiles", DEFAULT_TILES);
let pin = LS.get("pin", null);
let place = LS.get("place", null);
let theme = LS.get("theme", "auto");
let shopping = LS.get("shopping", []);
let timers = LS.get("timers", []);
let timerCount = LS.get("timerCount", 0);
let agendaUrl = LS.get("agendaUrl", null);
let wx = null, events = null, agendaError = false, edit = false, tab = 0;

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = d => { const r = Math.round(d * 100) / 100; return String(r).replace(".", ","); };
const num = s => { const v = parseFloat(String(s).trim().replace(",", ".")); return isNaN(v) ? null : v; };
const mmss = ms => {
  const s = Math.ceil(Math.max(0, ms) / 1000), p = n => String(n).padStart(2, "0");
  return s >= 3600 ? Math.floor(s / 3600) + ":" + p(Math.floor(s % 3600 / 60)) + ":" + p(s % 60) : p(Math.floor(s / 60)) + ":" + p(s % 60);
};

/* ---------- icons (24x24 line drawings) ---------- */
const CLOUD = "M7 18c-2.5 0-4-1.6-4-3.5 0-2 1.6-3.5 3.6-3.5.4-2.7 2.6-4.5 5.4-4.5 2.6 0 4.7 1.7 5.2 4.1 2.2.1 3.8 1.7 3.8 3.7 0 2.1-1.6 3.7-3.7 3.7z";
const cloudAt = (dy, extra) => `<path transform="translate(0,${dy})" d="${CLOUD}"/><path d="${extra}"/>`;
const P = d => `<path d="${d}"/>`;
const ICONS = {
  home: P("M3 11.5l9-8 9 8M5.5 9.5V20h13V9.5M10 20v-5.5h4V20"),
  pot: P("M5.5 11v6a3 3 0 0 0 3 3h7a3 3 0 0 0 3-3v-6M4 11h16M5.5 14H3M18.5 14H21M9 8c-1-1.2 1-2.3 0-3.5M12 8c-1-1.2 1-2.3 0-3.5M15 8c-1-1.2 1-2.3 0-3.5"),
  book: P("M12 6.5C10 4.8 6 4.6 3 5.6v13.2c3-1 7-.8 9 .9 2-1.7 6-1.9 9-.9V5.6c-3-1-7-.8-9 .9zM12 6.5v13.2"),
  chef: P("M7.5 15C3.8 15 3.2 10.2 6.6 9.4 6.6 5.8 10.6 4.6 12 7c1.4-2.4 5.4-1.2 5.4 2.4 3.4.8 2.8 5.6-.9 5.6M7.5 13v7h9v-7M7.5 17h9"),
  music: P("M9.5 17.5V6l10-2v11.5M9.5 9.5l10-2M9.5 17.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zM19.5 15.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"),
  play: P("M6.5 5.5h11a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4h-11a4 4 0 0 1-4-4v-5a4 4 0 0 1 4-4zM10 9l5.5 3-5.5 3z"),
  calendar: P("M6 5h12a2.5 2.5 0 0 1 2.5 2.5V18a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 18V7.5A2.5 2.5 0 0 1 6 5zM3.5 10h17M8 3v4M16 3v4M7.5 14H9M11.3 14h1.5M15 14h1.5M7.5 17H9M11.3 17h1.5"),
  globe: P("M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM16 12c0 5-1.8 9-4 9s-4-4-4-9 1.8-9 4-9 4 4 4 9zM3 12h18M4.6 7.5h14.8M4.6 16.5h14.8"),
  chat: P("M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4.5 3.5V17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM8 10h8M8 13h5"),
  sparkle: P("M12 3c.6 5.5 3.5 8.4 9 9-5.5.6-8.4 3.5-9 9-.6-5.5-3.5-8.4-9-9 5.5-.6 8.4-3.5 9-9z"),
  app: P("M4 4h6.5v6.5H4zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4zM13.5 13.5H20V20h-6.5z"),
  cart: P("M3 4h2.5l2.2 10.5h10.6L20.5 7H6.4M9 19.5h.01M17 19.5h.01"),
  mail: P("M5.5 5.5h13a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zM4 7.5l8 6 8-6"),
  tv: P("M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM8.5 20.5h7"),
  sun: P("M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"),
  cloud: P(CLOUD),
  partly: cloudAt(2, "M4.2 9.6C3.2 6.2 7.4 3.6 10 6.2M6.5 2v1.2M1.8 6.8H3M3.1 3.4l.9.9"),
  rain: cloudAt(-3, "M8.5 17.5l-1 3M12.5 17.5l-1 3M16.5 17.5l-1 3"),
  snow: cloudAt(-3, "M8 19h.01M12 20.5h.01M16 19h.01"),
  storm: cloudAt(-3, "M12.5 16.5l-2 2.8H13L11.2 22"),
  fog: cloudAt(-4, "M5 17.5h14M7 20.5h10"),
  gear: P("M4 7h10M18 7h2M4 17h2M10 17h10M18 7a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"),
};
const PICKABLE = ["app", "chat", "home", "pot", "book", "chef", "music", "play", "calendar", "globe", "sparkle", "cart", "mail", "tv", "sun"];
const icon = n => `<svg class="ic" viewBox="0 0 24 24">${ICONS[n] || ICONS.app}</svg>`;

/* ---------- theme, clock, tick ---------- */
function applyTheme() {
  const h = new Date().getHours();
  const light = theme === "light" || (theme === "auto" && h >= 7 && h < 19);
  document.documentElement.classList.toggle("light", light);
}
function tick() {
  const now = new Date();
  $("#clock").textContent = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  $("#date").textContent = now.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
  applyTheme();
  let changed = false;
  timers.forEach(t => { if (!t.done && Date.now() >= t.endAt) { t.done = true; changed = true; } });
  if (changed) LS.set("timers", timers);
  Alarm.set(timers.some(t => t.done));
  renderChips();
  if (!$("#kitchen").classList.contains("hidden") && tab === 0) renderTimerList();
}

/* ---------- alarm sound ---------- */
const Alarm = {
  ctx: null, on: false, id: 0,
  unlock() { // browsers only allow sound after a touch
    if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  beep() {
    if (!this.ctx) return;
    [0, .25, .5].forEach(o => {
      const osc = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime + o;
      osc.frequency.value = 880; g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
      osc.connect(g); g.connect(this.ctx.destination); osc.start(t); osc.stop(t + .22);
    });
  },
  set(on) {
    if (on === this.on) return;
    this.on = on; clearInterval(this.id);
    if (on) { this.beep(); this.id = setInterval(() => this.beep(), 1400); }
  },
};
document.addEventListener("pointerdown", () => Alarm.unlock(), true);

/* ---------- home ---------- */
function renderChips() {
  const now = Date.now();
  $("#chips").innerHTML = timers.slice(0, 3).map(t =>
    `<div class="chip glass ${t.done ? "strong" : ""}" data-act="chip" data-id="${t.id}">${t.done ? "⏰ fertig" : "⏱ " + mmss(t.endAt - now)}</div>`).join("") +
    `<div id="gear" class="glass ${edit ? "strong" : ""}" data-act="gear">${edit ? "✓" : icon("gear")}</div>`;
}
function weatherIcon(c) {
  if (c <= 1) return "sun"; if (c === 2) return "partly"; if (c === 3) return "cloud"; if (c === 45 || c === 48) return "fog";
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return "rain"; if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
  if (c >= 95) return "storm"; return "cloud";
}
function weatherText(c) {
  if (c === 0) return "Klar"; if (c === 1) return "Überwiegend klar"; if (c === 2) return "Leicht bewölkt"; if (c === 3) return "Bedeckt";
  if (c === 45 || c === 48) return "Nebel"; if (c >= 51 && c <= 57) return "Nieselregen"; if (c >= 61 && c <= 67) return "Regen";
  if (c >= 80 && c <= 82) return "Regenschauer"; if (c >= 71 && c <= 77) return "Schnee"; if (c === 85 || c === 86) return "Schneeschauer";
  if (c >= 95) return "Gewitter"; return "";
}
function tileHtml(t, i) {
  const bar = edit ? `<div class="editbar"><div class="round" data-act="left" data-i="${i}">←</div><div class="round" data-act="right" data-i="${i}">→</div><div class="round right" data-act="del" data-i="${i}">✕</div></div>` : "";
  if (t.type === "weather") {
    let body;
    if (!place) body = `<div class="label">Wetter</div><div class="small">Tippen für den Ort</div>`;
    else if (!wx) body = `<div class="temp">–</div><div class="small">${esc(place.name)}</div>`;
    else body = `<div class="temp">${Math.round(wx.temp)}°</div><div class="mid">${weatherText(wx.code)}</div><div class="small">${esc(place.name)} · ${Math.round(wx.hi)}° / ${Math.round(wx.lo)}°</div>`;
    return `<div class="tile wx glass" data-act="tile" data-i="${i}"><div class="badge">${icon(wx ? weatherIcon(wx.code) : "partly")}</div>${body}${bar}</div>`;
  }
  if (t.type === "agenda") {
    let body;
    if (!agendaUrl) body = `<div class="small" style="white-space:normal">Tippen, um den Kalender zu verbinden</div>`;
    else if (!events) body = `<div class="small">${agendaError ? "Kalender nicht erreichbar" : "Lädt …"}</div>`;
    else if (!events.length) body = `<div class="small">Keine Termine in den nächsten 30 Tagen</div>`;
    else body = events.slice(0, 4).map(e => `<div class="ev"><b>${whenText(e)}</b><span>${esc(e.title || "(ohne Titel)")}</span></div>`).join("");
    return `<div class="tile ag glass" data-span="2" data-act="tile" data-i="${i}"><div class="aghead"><div class="badge">${icon("calendar")}</div>Anstehende Termine</div>${body}${bar}</div>`;
  }
  return `<div class="tile glass" data-act="tile" data-i="${i}"><div class="badge">${icon(t.icon)}</div><div class="label">${esc(t.label)}</div>${bar}</div>`;
}
function renderHome() {
  const g = $("#grid");
  g.innerHTML = tiles.map(tileHtml).join("") + (edit ? `<div class="tile glass" data-act="add"><div class="plus">+</div></div>` : "");
  layout(); renderChips();
}
/* Pick the column count that gives the largest tiles while everything fits on one screen. */
function rowsFor(spans, c) {
  const pending = spans.slice(); let rows = 0;
  while (pending.length) {
    let free = c, placed = false;
    for (let k = 0; k < pending.length && free > 0;) {
      if (pending[k] <= free) { free -= pending[k]; pending.splice(k, 1); placed = true; } else k++;
    }
    if (!placed) return 0;
    rows++;
  }
  return rows;
}
function layout() {
  const g = $("#grid"), gap = 18, W = g.clientWidth, H = g.clientHeight;
  const spans = Array.from(g.children).map(el => +(el.dataset.span || 1));
  if (!spans.length || !W || !H) return;
  let best = null;
  for (let c = 2; c <= 9; c++) {
    const rows = rowsFor(spans, c); if (!rows) continue;
    const w = (W - gap * (c - 1)) / c, h = Math.min((H - gap * (rows - 1)) / rows, w * 1.3);
    if (!best || Math.min(w, h) > Math.min(best.w, best.h)) best = { c, w, h };
  }
  g.style.gridTemplateColumns = `repeat(${best.c}, ${best.w}px)`;
  g.style.gridAutoRows = best.h + "px";
  document.documentElement.style.setProperty("--b", Math.min(best.w, best.h) * 0.58 + "px");
}
window.addEventListener("resize", layout);

function openTile(t) {
  if (t.type === "kitchen") return show("kitchen");
  if (t.type === "weather") return placeDialog();
  if (t.type === "agenda" && !agendaUrl) return agendaDialog();
  if (!t.url) return;
  if (/^https?:/i.test(t.url)) window.open(t.url, "_blank"); else location.href = t.url;
}
function show(name) {
  $("#home").classList.toggle("hidden", name !== "home");
  $("#kitchen").classList.toggle("hidden", name !== "kitchen");
  if (name === "kitchen") renderKitchen(); else renderHome();
}

/* ---------- weather (Open-Meteo: free, no account) ---------- */
async function loadWeather() {
  if (!place) { wx = null; return renderHome(); }
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
    const o = await r.json();
    wx = { temp: o.current.temperature_2m, code: o.current.weather_code, hi: o.daily.temperature_2m_max[0], lo: o.daily.temperature_2m_min[0] };
  } catch (e) {}
  if (!$("#home").classList.contains("hidden")) renderHome();
}
function placeDialog() {
  dialog(`<h2>Ort für das Wetter</h2><div class="stack"><input id="pl" placeholder="Stadt oder Ort" value="${esc(place ? place.name : "")}">
    <div class="row"><div class="btn glass strong" data-act="placeok">Übernehmen</div><div class="btn glass" data-act="close">Abbrechen</div><span id="plmsg" class="small"></span></div></div>`);
}
async function placeSearch() {
  const name = $("#pl").value.trim(); if (!name) return;
  $("#plmsg").textContent = "Suche …";
  try {
    const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&format=json&name=" + encodeURIComponent(name));
    const f = (await r.json()).results[0];
    place = { name: f.name, lat: f.latitude, lon: f.longitude }; LS.set("place", place);
    closeDialog(); loadWeather();
  } catch (e) { $("#plmsg").textContent = "Ort nicht gefunden"; }
}

/* ---------- calendar (a small Google Apps Script in the owner's account hands out the next events) ---------- */
function whenText(e) {
  const d = new Date(e.start), now = new Date(), key = x => x.getFullYear() * 10000 + x.getMonth() * 100 + x.getDate();
  const tomorrow = new Date(now.getTime() + 86400000);
  const day = key(d) === key(now) ? "Heute" : key(d) === key(tomorrow) ? "Morgen"
    : d.toLocaleDateString("de-DE", { weekday: "short" }).replace(".", "") + " " + d.getDate() + "." + (d.getMonth() + 1) + ".";
  return e.allDay ? day : day + " " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}
async function loadAgenda() {
  if (!agendaUrl) { events = null; return; }
  try {
    const r = await fetch(agendaUrl, { redirect: "follow" });
    const list = await r.json();
    if (!Array.isArray(list)) throw new Error("unexpected answer");
    events = list; agendaError = false;
  } catch (e) { agendaError = true; }
  if (!$("#home").classList.contains("hidden") && $("#dlg").classList.contains("hidden")) renderHome();
}
function agendaDialog() {
  dialog(`<h2>Kalender verbinden</h2><div class="stack" style="width:520px">
    <div class="small" style="white-space:normal">Adresse der Web-App aus Google Apps Script einfügen (beginnt mit https://script.google.com/).</div>
    <input id="au" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(agendaUrl || "")}" autocapitalize="off" autocorrect="off">
    <div class="row"><div class="btn glass strong" data-act="agendaok">Übernehmen</div><div class="btn glass" data-act="close">Abbrechen</div><span id="aumsg" class="small"></span></div></div>`);
}
function agendaSave() {
  const v = $("#au").value.trim();
  if (v && !/^https:\/\/script\.google\.com\//.test(v)) { $("#aumsg").textContent = "Das ist keine Apps-Script-Adresse"; return; }
  agendaUrl = v || null; LS.set("agendaUrl", agendaUrl); events = null; agendaError = false;
  closeDialog(); renderHome(); loadAgenda();
}

/* ---------- dialogs ---------- */
function dialog(html) { const d = $("#dlg"); d.innerHTML = `<div class="card">${html}</div>`; d.classList.remove("hidden"); }
function closeDialog() { $("#dlg").classList.add("hidden"); $("#dlg").innerHTML = ""; }
let padState = null;
function pinPad(title, done) {
  padState = { entry: "", title, done };
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"];
  dialog(`<h2 id="padtitle" style="text-align:center">${esc(title)}</h2><div class="dots" id="dots"></div>
    <div class="pad">${keys.map(k => k ? `<div class="glass" data-act="key" data-k="${k}">${k}</div>` : "<span></span>").join("")}</div>`);
  drawDots();
}
function drawDots() { $("#dots").innerHTML = [0, 1, 2, 3].map(i => `<i class="${i < padState.entry.length ? "on" : ""}"></i>`).join(""); }
function padKey(k) {
  const s = padState; if (!s) return;
  s.entry = k === "⌫" ? s.entry.slice(0, -1) : s.entry + k;
  drawDots();
  if (s.entry.length === 4) { const e = s.entry; s.entry = ""; setTimeout(() => s.done(e), 120); }
}
function askPin(ok) {
  pinPad("PIN eingeben", e => { if (e === pin) { closeDialog(); ok(); } else { $("#padtitle").textContent = "Falsche PIN"; drawDots(); } });
}
function setupPin(after) {
  pinPad("Neue PIN festlegen", first => {
    pinPad("PIN wiederholen", second => {
      if (first === second) { pin = first; LS.set("pin", pin); closeDialog(); if (after) after(); }
      else setupPin(after);
    });
  });
}
function menu() {
  const names = { auto: "Automatisch", light: "Hell", dark: "Dunkel" };
  dialog(`<h2>Verwaltung</h2><div class="stack">
    <div class="btn glass" data-act="editon">Kacheln bearbeiten</div>
    <div class="btn glass" data-act="theme">Design: ${names[theme]}</div>
    <div class="btn glass" data-act="newpin">PIN ändern</div>
    <div class="btn glass" data-act="reload">Website aktualisieren</div>
    <div class="small" style="text-align:center" id="vers">Version ${VERSION}</div>
    <div class="btn glass" data-act="close">Schließen</div></div>`);
}
let editing = null;
function tileDialog(i) {
  const t = i == null ? { id: "t" + Date.now(), type: "link", label: "", icon: "app", url: "" } : Object.assign({}, tiles[i]);
  editing = { i, t };
  const link = t.type === "link" ? `<input id="tu" placeholder="Link, z. B. https://… oder spotify://" value="${esc(t.url || "")}" autocapitalize="off" autocorrect="off">
    <div class="icons" id="icons"></div>` : "";
  dialog(`<h2>${i == null ? "Kachel hinzufügen" : "Kachel bearbeiten"}</h2><div class="stack" style="width:440px">
    <input id="tl" placeholder="Name" value="${esc(t.label)}">${link}
    <div class="row"><div class="btn glass strong" data-act="tilesave">Speichern</div><div class="btn glass" data-act="close">Abbrechen</div></div></div>`);
  drawIcons();
}
function drawIcons() {
  const box = $("#icons"); if (!box) return;
  box.innerHTML = PICKABLE.map(n => `<div class="glass ${editing.t.icon === n ? "strong" : ""}" data-act="pick" data-n="${n}">${icon(n)}</div>`).join("");
}
function saveTiles() { LS.set("tiles", tiles); renderHome(); }

/* ---------- kitchen helper ---------- */
const TABS = ["Timer", "Umrechner", "Portionen", "Einkaufsliste"];
const WEIGHT = [["g", 1], ["kg", 1000], ["oz", 28.3495], ["lb", 453.592]];
const VOLUME = [["ml", 1], ["l", 1000], ["TL", 5], ["EL", 15], ["Tasse (US)", 240], ["fl oz", 29.5735]];
const K = { custom: 25, cat: 0, unit: 0, value: "100", from: 4, to: 2, text: "500 g Hackfleisch\n2 Zwiebeln\n0,5 l Brühe" };
function renderKitchen() {
  $("#tabs").innerHTML = TABS.map((t, i) => `<div class="btn glass ${tab === i ? "strong" : ""}" data-act="tab" data-i="${i}">${t}</div>`).join("");
  const b = $("#kbody");
  if (tab === 0) {
    b.innerHTML = `<div class="cols"><div>
      <p class="sub">Neuer Timer</p><div class="wrap">${[1, 3, 5, 8, 10, 12, 15, 20, 30, 45, 60, 90].map(m => `<div class="btn glass" data-act="timer" data-m="${m}">${m} min</div>`).join("")}</div>
      <p class="sub" style="margin-top:24px">Eigene Zeit</p>
      <div class="row" style="flex-wrap:wrap"><div class="btn glass" data-act="cust" data-d="-5">−5</div><div class="btn glass" data-act="cust" data-d="-1">−1</div>
      <b style="font-size:28px;margin:0 4px;white-space:nowrap">${K.custom} min</b>
      <div class="btn glass" data-act="cust" data-d="1">+1</div><div class="btn glass" data-act="cust" data-d="5">+5</div>
      <div class="btn glass strong" data-act="timer" data-m="${K.custom}">Start</div></div></div><div id="tlist"></div></div>`;
    renderTimerList();
  } else if (tab === 1) {
    const units = K.cat === 0 ? WEIGHT : K.cat === 1 ? VOLUME : [["°C"], ["°F"]];
    b.innerHTML = `<div class="wrap">${["Gewicht", "Volumen", "Temperatur"].map((n, i) => `<div class="btn glass ${K.cat === i ? "strong" : ""}" data-act="cat" data-i="${i}">${n}</div>`).join("")}</div>
      <div class="row" style="margin:18px 0;flex-wrap:wrap"><input id="cv" inputmode="decimal" style="width:190px" value="${esc(K.value)}">
      ${units.map((u, i) => `<div class="btn glass ${K.unit === i ? "strong" : ""}" data-act="unit" data-i="${i}">${u[0]}</div>`).join("")}</div><div id="cres"></div>`;
    renderConv();
  } else if (tab === 2) {
    const step = (k, l) => `<div class="row" style="margin-bottom:10px"><span style="width:150px;font-size:20px">${l}</span>
      <div class="btn glass" data-act="por" data-k="${k}" data-d="-1">−</div><b style="font-size:28px;min-width:40px;text-align:center">${K[k]}</b>
      <div class="btn glass" data-act="por" data-k="${k}" data-d="1">+</div><span style="font-size:20px">Portionen</span></div>`;
    b.innerHTML = `<div class="cols"><div>${step("from", "Rezept ist für")}${step("to", "Ich koche für")}
      <p class="sub" style="margin-top:14px">Zutaten (eine pro Zeile)</p><textarea id="pt" rows="8">${esc(K.text)}</textarea></div><div id="pres"></div></div>`;
    renderPortions();
  } else {
    b.innerHTML = `<div class="row" style="margin-bottom:16px"><input id="si" placeholder="Was fehlt?" enterkeyhint="done">
      <div class="btn glass strong" data-act="sadd">Hinzufügen</div><div class="btn glass" data-act="sclear">Erledigte löschen</div></div><div id="slist"></div>`;
    renderShopping();
  }
}
function renderTimerList() {
  const el = $("#tlist"); if (!el) return;
  const now = Date.now();
  el.innerHTML = timers.length ? timers.map(t => {
    const frac = t.done ? 1 : Math.min(1, Math.max(0, 1 - (t.endAt - now) / t.total));
    return `<div class="tcard glass ${t.done ? "strong" : ""}"><div class="row"><div style="flex:1"><div class="small">${esc(t.label)}</div>
      <div class="big">${t.done ? "Fertig!" : mmss(t.endAt - now)}</div></div><div class="btn glass" data-act="tdel" data-id="${t.id}">${t.done ? "Aus" : "Löschen"}</div></div>
      <div class="bar"><i style="width:${frac * 100}%"></i></div></div>`;
  }).join("") : `<p class="sub">Kein Timer aktiv</p>`;
}
function renderConv() {
  const el = $("#cres"); if (!el) return;
  const v = num(K.value);
  if (v == null) { el.innerHTML = `<p class="sub">Bitte eine Zahl eingeben</p>`; return; }
  if (K.cat === 2) { el.innerHTML = `<div class="res" style="font-size:40px;font-weight:600">= ${K.unit === 0 ? fmt(v * 9 / 5 + 32) + " °F" : fmt((v - 32) * 5 / 9) + " °C"}</div>`; return; }
  const units = K.cat === 0 ? WEIGHT : VOLUME, base = v * units[K.unit][1];
  el.innerHTML = units.map((u, i) => i === K.unit ? "" : `<div class="res">= ${fmt(base / u[1])} ${u[0]}</div>`).join("");
}
function renderPortions() {
  const el = $("#pres"); if (!el) return;
  const f = K.to / K.from;
  el.innerHTML = `<p class="sub">Umgerechnet für ${K.to} Portionen</p>` + K.text.split("\n").filter(l => l.trim()).map(l =>
    `<div class="res">${esc(l.replace(/\d+(?:[.,]\d+)?/g, m => fmt(parseFloat(m.replace(",", ".")) * f)))}</div>`).join("");
}
function renderShopping() {
  const el = $("#slist"); if (!el) return;
  el.innerHTML = shopping.length ? shopping.map(s => `<div class="item glass ${s.done ? "done" : ""}" data-act="stoggle" data-id="${s.id}">${s.done ? "☑" : "☐"}<span>${esc(s.text)}</span></div>`).join("")
    : `<p class="sub">Die Liste ist leer</p>`;
}
function addShopping() {
  const i = $("#si"), v = i.value.trim(); if (!v) return;
  shopping.unshift({ id: Date.now(), text: v, done: false }); LS.set("shopping", shopping); i.value = ""; renderShopping();
}

/* ---------- one click handler for everything ---------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, i = el.dataset.i == null ? null : +el.dataset.i;
  switch (a) {
    case "home": show("home"); break;
    case "gear": if (edit) { edit = false; renderHome(); } else if (!pin) setupPin(menu); else askPin(menu); break;
    case "chip": { const t = timers.find(t => t.id == el.dataset.id); if (t && t.done) { timers = timers.filter(x => x !== t); LS.set("timers", timers); } else { tab = 0; show("kitchen"); } break; }
    case "tile":
      if (!edit) openTile(tiles[i]);
      else if (tiles[i].type === "agenda") agendaDialog();
      else if (tiles[i].type !== "weather") tileDialog(i);
      break;
    case "agendaok": agendaSave(); break;
    case "add": tileDialog(null); break;
    case "left": case "right": {
      ev.stopPropagation(); const to = i + (a === "left" ? -1 : 1);
      if (to >= 0 && to < tiles.length) { tiles.splice(to, 0, tiles.splice(i, 1)[0]); saveTiles(); } break;
    }
    case "del": tiles.splice(i, 1); saveTiles(); break;
    case "close": closeDialog(); break;
    case "key": padKey(el.dataset.k); break;
    case "editon": closeDialog(); edit = true; renderHome(); break;
    case "theme": theme = { auto: "light", light: "dark", dark: "auto" }[theme]; LS.set("theme", theme); applyTheme(); menu(); break;
    case "newpin": setupPin(null); break;
    case "reload":
      // Fetch a fresh copy past the browser cache first, then reload onto it.
      $("#vers").textContent = "Wird aktualisiert …";
      fetch(location.href, { cache: "reload" }).catch(() => {}).then(() => location.reload());
      break;
    case "pick": editing.t.icon = el.dataset.n; drawIcons(); break;
    case "tilesave": {
      const t = editing.t; t.label = $("#tl").value.trim() || "Kachel"; if ($("#tu")) t.url = $("#tu").value.trim();
      if (editing.i == null) tiles.push(t); else tiles[editing.i] = t;
      closeDialog(); saveTiles(); break;
    }
    case "placeok": placeSearch(); break;
    case "tab": tab = i; renderKitchen(); break;
    case "timer": {
      const m = +el.dataset.m; timerCount++; LS.set("timerCount", timerCount);
      timers.push({ id: Date.now(), label: `Timer ${timerCount} · ${m} min`, total: m * 60000, endAt: Date.now() + m * 60000, done: false });
      LS.set("timers", timers); renderTimerList(); break;
    }
    case "tdel": timers = timers.filter(t => t.id != el.dataset.id); LS.set("timers", timers); renderTimerList(); break;
    case "cust": K.custom = Math.min(600, Math.max(1, K.custom + +el.dataset.d)); renderKitchen(); break;
    case "cat": K.cat = i; K.unit = 0; K.value = $("#cv").value; renderKitchen(); break;
    case "unit": K.unit = i; K.value = $("#cv").value; renderKitchen(); break;
    case "por": K[el.dataset.k] = Math.min(50, Math.max(1, K[el.dataset.k] + +el.dataset.d)); K.text = $("#pt").value; renderKitchen(); break;
    case "sadd": addShopping(); break;
    case "sclear": shopping = shopping.filter(s => !s.done); LS.set("shopping", shopping); renderShopping(); break;
    case "stoggle": { const s = shopping.find(s => s.id == el.dataset.id); if (s) { s.done = !s.done; LS.set("shopping", shopping); renderShopping(); } break; }
  }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "cv") { K.value = ev.target.value; renderConv(); }
  if (ev.target.id === "pt") { K.text = ev.target.value; renderPortions(); }
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  if (ev.target.id === "si") addShopping();
  if (ev.target.id === "pl") placeSearch();
});

/* ---------- keep the screen on where the browser allows it ---------- */
async function wake() { try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (!document.hidden) { wake(); tick(); } });

applyTheme(); renderHome(); tick(); wake(); loadWeather(); loadAgenda();
setInterval(loadAgenda, 5 * 60 * 1000);
setInterval(tick, 500);
setInterval(loadWeather, 20 * 60 * 1000);
</script>
</body>
</html>
